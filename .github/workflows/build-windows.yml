name: EdenLauncher Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edenlauncher-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x86_64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: true

    steps:
      - name: Check out EdenLauncher overlay
        uses: actions/checkout@v4

      - name: Clone upstream launcher source
        shell: pwsh
        run: git clone --depth 1 --branch release https://git.xorison.dev/didirus/AstralRinth.git source

      - name: Apply EdenLauncher source changes
        shell: pwsh
        run: |
          $overlayRoot = (Resolve-Path '.').Path
          $sourceRoot = (Resolve-Path 'source').Path
          $removedPaths = @(
            'apps/app-frontend/src/assets/astralrinth-app.svg',
            'apps/app-frontend/src/components/ui/settings/astralrinth/AstralRinthSettingsPage.vue'
          )

          foreach ($relativePath in $removedPaths) {
            $target = Join-Path $sourceRoot $relativePath
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Force
            }
          }

          @('apps', 'packages') | ForEach-Object {
            $overlayDirectory = Join-Path $overlayRoot $_
            if (Test-Path -LiteralPath $overlayDirectory) {
              Get-ChildItem -LiteralPath $overlayDirectory -File -Recurse | ForEach-Object {
                $relativePath = $_.FullName.Substring($overlayRoot.Length + 1)
                $normalizedPath = $relativePath -replace '\\', '/'
                if ($removedPaths -notcontains $normalizedPath) {
                  $destination = Join-Path $sourceRoot $relativePath
                  New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
                  Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
                }
              }
            }
          }

      - name: Download EdenWorld branding
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://cdn.easydonate.ru/images/logos/b6/53/b653e7ee3e92c6cd8e66a5b488e3bb04aea407f9b2051d76b5b9dffe4e25b1fd.jpg' -OutFile 'source/apps/app-frontend/src/assets/edenworld-logo.jpg'
          Invoke-WebRequest -Uri 'https://cdn.easydonate.ru/images/backgrounds/da/e7/dae72ff86676ef5b3ef20b299be37a560fcc7353ea4331aec5039716d8d7ac0c.png' -OutFile 'source/apps/app-frontend/src/assets/edenworld-background.png'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          target: x86_64-pc-windows-msvc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          cache-on-failure: true

      - name: Set application environment
        shell: pwsh
        working-directory: source
        run: Copy-Item -LiteralPath 'packages/app-lib/.env.prod' -Destination 'packages/app-lib/.env' -Force

      - name: Install dependencies
        shell: pwsh
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Generate EdenWorld application icons
        shell: pwsh
        working-directory: source/apps/app
        run: pnpm exec tauri icon ../app-frontend/src/assets/edenworld-logo.jpg -o icons

      - name: Build EdenLauncher
        shell: pwsh
        working-directory: source
        run: pnpm --filter @modrinth/app exec tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: EdenLauncher-Windows-x64
          path: source/target/x86_64-pc-windows-msvc/release/bundle/**
          if-no-files-found: error

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'source/apps/app-frontend/package.json' -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          $releaseExists = $true
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) { $releaseExists = $false }

          if ($releaseExists) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "EdenLauncher $env:RELEASE_TAG" --latest
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "EdenLauncher $env:RELEASE_TAG" --notes "Автоматическая сборка EdenLauncher для Windows x64." --latest
          }

          $assets = Get-ChildItem -LiteralPath 'source/target/x86_64-pc-windows-msvc/release/bundle' -File -Recurse | Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $assets) { throw 'Windows installers were not found.' }
          foreach ($asset in $assets) {
            gh release upload $env:RELEASE_TAG $asset.FullName --repo $env:GITHUB_REPOSITORY --clobber
          }
