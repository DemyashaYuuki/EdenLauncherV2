name: EdenLauncher 2.0 Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edenlauncher-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x86_64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: true

    steps:
      - name: Check out EdenLauncher overlay
        uses: actions/checkout@v4

      - name: Clone AstralRinth release source
        shell: pwsh
        run: git clone --depth 1 --branch release https://git.xorison.dev/didirus/AstralRinth.git source

      - name: Apply EdenLauncher source changes
        shell: pwsh
        run: |
          $overlayRoot = (Resolve-Path '.').Path
          $sourceRoot = (Resolve-Path 'source').Path

          Get-ChildItem -LiteralPath (Join-Path $overlayRoot 'apps') -File -Recurse | ForEach-Object {
            $relativePath = $_.FullName.Substring($overlayRoot.Length + 1)
            $destination = Join-Path $sourceRoot $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
          }

      - name: Download EdenWorld branding
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://cdn.easydonate.ru/images/logos/b6/53/b653e7ee3e92c6cd8e66a5b488e3bb04aea407f9b2051d76b5b9dffe4e25b1fd.jpg' -OutFile 'source/apps/app-frontend/src/assets/edenworld-logo.jpg'
          Invoke-WebRequest -Uri 'https://cdn.easydonate.ru/images/backgrounds/da/e7/dae72ff86676ef5b3ef20b299be37a560fcc7353ea4331aec5039716d8d7ac0c.png' -OutFile 'source/apps/app-frontend/src/assets/edenworld-background.png'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          target: x86_64-pc-windows-msvc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          cache-on-failure: true

      - name: Set application environment
        shell: pwsh
        working-directory: source
        run: Copy-Item -LiteralPath 'packages/app-lib/.env.prod' -Destination 'packages/app-lib/.env' -Force

      - name: Install dependencies
        shell: pwsh
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Generate EdenWorld application icons
        shell: pwsh
        working-directory: source/apps/app
        run: pnpm exec tauri icon ../app-frontend/src/assets/edenworld-logo.jpg -o icons

      - name: Build EdenLauncher 2.0
        shell: pwsh
        working-directory: source
        run: pnpm --filter @modrinth/app exec tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: EdenLauncher-2.0-Windows-x64
          path: source/target/x86_64-pc-windows-msvc/release/bundle/**
          if-no-files-found: error

