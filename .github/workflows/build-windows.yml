name: EdenLauncher Desktop Build

on:
  push:
    branches:
      - main
      - codex/eden-2.10-validation
      - codex/eden-2.10.1-validation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edenlauncher-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-checks:
    name: Skin Studio engine and server bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Test editor engine
        run: node --experimental-strip-types --test apps/app-frontend/tests/skin-studio/*.test.ts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test server bridge
        working-directory: server/eden-skin-bridge
        run: bash gradlew build --no-daemon --console=plain
      - name: Package bridge source and instructions
        run: zip -q -r EdenSkinBridge-source.zip server/eden-skin-bridge -x '*/build/*' '*/.gradle/*'
      - name: Upload server bridge packages and test reports
        uses: actions/upload-artifact@v4
        with:
          name: EdenSkinBridge
          path: |
            EdenSkinBridge-source.zip
            server/eden-skin-bridge/paper/build/libs/EdenSkinBridge-Paper-*.jar
            server/eden-skin-bridge/velocity/build/libs/EdenSkinBridge-Velocity-*.jar
            server/eden-skin-bridge/*/build/test-results/test/*.xml
          if-no-files-found: error

  build-windows:
    name: Windows x86_64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: true

    steps:
      - name: Check out EdenLauncher overlay
        uses: actions/checkout@v4

      - name: Check release version metadata
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'apps/app-frontend/package.json' -Raw | ConvertFrom-Json).version
          $manifest = Get-Content -LiteralPath 'apps/app/Cargo.toml' -Raw
          $cargoVersion = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($version -ne $cargoVersion) { throw "Release version mismatch: frontend=$version, Rust=$cargoVersion" }

      - name: Clone upstream launcher source
        shell: pwsh
        run: |
          git init source
          git -C source remote add origin https://git.xorison.dev/didirus/AstralRinth.git
          git -C source fetch --depth 1 origin 80a011e8008ce4f0fd828b98a4a5a2fdcbc01c86
          git -C source checkout --detach FETCH_HEAD

      - name: Apply EdenLauncher source changes
        shell: pwsh
        run: |
          $overlayRoot = (Resolve-Path '.').Path
          $sourceRoot = (Resolve-Path 'source').Path
          $removedPaths = @(
            'apps/app-frontend/src/assets/astralrinth-app.svg',
            'apps/app-frontend/src/components/ui/settings/astralrinth/AstralRinthSettingsPage.vue'
          )

          foreach ($relativePath in $removedPaths) {
            $target = Join-Path $sourceRoot $relativePath
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Force
            }
          }

          @('apps', 'packages') | ForEach-Object {
            $overlayDirectory = Join-Path $overlayRoot $_
            if (Test-Path -LiteralPath $overlayDirectory) {
              Get-ChildItem -LiteralPath $overlayDirectory -File -Recurse | ForEach-Object {
                $relativePath = $_.FullName.Substring($overlayRoot.Length + 1)
                $normalizedPath = $relativePath -replace '\\', '/'
                if ($removedPaths -notcontains $normalizedPath) {
                  $destination = Join-Path $sourceRoot $relativePath
                  New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
                  Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
                }
              }
            }
          }

      - name: Apply release lockfile metadata
        shell: pwsh
        run: Copy-Item -LiteralPath 'Cargo.lock' -Destination 'source/Cargo.lock' -Force

      - name: Download EdenWorld branding
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://cdn.easydonate.ru/images/logos/b6/53/b653e7ee3e92c6cd8e66a5b488e3bb04aea407f9b2051d76b5b9dffe4e25b1fd.jpg' -OutFile 'source/apps/app-frontend/src/assets/edenworld-logo.jpg'
          Invoke-WebRequest -Uri 'https://cdn.easydonate.ru/images/backgrounds/da/e7/dae72ff86676ef5b3ef20b299be37a560fcc7353ea4331aec5039716d8d7ac0c.png' -OutFile 'source/apps/app-frontend/src/assets/edenworld-background.png'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          target: x86_64-pc-windows-msvc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          cache-on-failure: true

      - name: Set application environment
        shell: pwsh
        working-directory: source
        run: Copy-Item -LiteralPath 'packages/app-lib/.env.prod' -Destination 'packages/app-lib/.env' -Force

      - name: Install dependencies
        shell: pwsh
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Generate EdenWorld application icons
        shell: pwsh
        working-directory: source/apps/app
        run: pnpm exec tauri icon ../app-frontend/src/assets/eden/brand/eden-app-icon-512.png -o icons

      - name: Download and verify the Microsoft WebView2 bootstrapper
        shell: pwsh
        run: ./.github/scripts/prepare-webview2.ps1

      - name: Build EdenLauncher for Windows
        shell: pwsh
        working-directory: source
        run: pnpm --filter @modrinth/app exec tauri build --target x86_64-pc-windows-msvc

      - name: Test Skin Studio Rust APIs
        shell: pwsh
        working-directory: source
        run: cargo test -p theseus --lib skin --target x86_64-pc-windows-msvc

      - name: Verify Windows installers and data preservation
        shell: pwsh
        run: ./.github/scripts/test-windows-installer.ps1 -BundleDirectory '${{ github.workspace }}/source/target/x86_64-pc-windows-msvc/release/bundle'

      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EdenLauncher-Windows-Verification
          path: windows-installer-evidence/**
          if-no-files-found: warn

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: EdenLauncher-Windows-x64
          path: source/target/x86_64-pc-windows-msvc/release/bundle/**
          if-no-files-found: error

  build-linux:
    name: Linux x86_64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CI: true

    steps:
      - name: Check out EdenLauncher overlay
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Clone upstream launcher source
        run: |
          git init source
          git -C source remote add origin https://git.xorison.dev/didirus/AstralRinth.git
          git -C source fetch --depth 1 origin 80a011e8008ce4f0fd828b98a4a5a2fdcbc01c86
          git -C source checkout --detach FETCH_HEAD

      - name: Apply EdenLauncher source changes
        run: |
          cp -a apps/. source/apps/
          cp -a packages/. source/packages/
          cp Cargo.lock source/Cargo.lock
          rm -f source/apps/app-frontend/src/assets/astralrinth-app.svg
          rm -f source/apps/app-frontend/src/components/ui/settings/astralrinth/AstralRinthSettingsPage.vue

      - name: Download EdenWorld branding
        run: |
          curl --fail --location 'https://cdn.easydonate.ru/images/logos/b6/53/b653e7ee3e92c6cd8e66a5b488e3bb04aea407f9b2051d76b5b9dffe4e25b1fd.jpg' --output source/apps/app-frontend/src/assets/edenworld-logo.jpg
          curl --fail --location 'https://cdn.easydonate.ru/images/backgrounds/da/e7/dae72ff86676ef5b3ef20b299be37a560fcc7353ea4331aec5039716d8d7ac0c.png' --output source/apps/app-frontend/src/assets/edenworld-background.png

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          target: x86_64-unknown-linux-gnu

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          cache-on-failure: true

      - name: Set application environment
        working-directory: source
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Generate EdenWorld application icons
        working-directory: source/apps/app
        run: pnpm exec tauri icon ../app-frontend/src/assets/eden/brand/eden-app-icon-512.png -o icons

      - name: Build EdenLauncher for Linux
        working-directory: source
        run: pnpm --filter @modrinth/app exec tauri build --target x86_64-unknown-linux-gnu --bundles deb,appimage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: EdenLauncher-Linux-x64
          path: source/target/x86_64-unknown-linux-gnu/release/bundle/**
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish EdenLauncher release
    runs-on: ubuntu-latest
    needs:
      - studio-checks
      - build-windows
      - build-linux

    steps:
      - name: Check out EdenLauncher overlay
        uses: actions/checkout@v4

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./apps/app-frontend/package.json').version")"
          TAG="v${VERSION}"
          NOTES='EdenLauncher 2.10.1: мастерская перенесена во вкладку «Скины», отдельный пункт меню убран. Исправлена синхронизация аккаунтов после входа, переключения, удаления и повторного открытия редактора. Ошибка загрузки аккаунтов больше не выдаётся за отсутствие аккаунта: есть отдельное сообщение и повторная попытка. Офлайн-аккаунт виден в редакторе и может открыть привязку EdenSkinBridge. Старый гардероб Microsoft доступен из редактора. Сохранены проекты, инструменты, Microsoft-интеграция и плагины 2.10. Для Ely.by — экспорт PNG и сайт; серверный мост требует отдельной настройки. CI проверяет установку, обновление с 2.10.0 и сохранность тестовых данных. Приложены протокол Windows-проверок и SHA256SUMS.txt.'

          NOTES="$NOTES Настройки мастерской: видимые переключатели с состояниями Включено/Выключено и пояснениями, проценты сетки и сворачиваемые сочетания клавиш."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "EdenLauncher $TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "EdenLauncher $TAG" --notes "$NOTES" --latest
          fi

          mapfile -d '' assets < <(find release-assets/EdenLauncher-Windows-x64 release-assets/EdenLauncher-Linux-x64 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'Desktop packages were not found.' >&2
            exit 1
          fi
          (cd release-assets/EdenLauncher-Windows-Verification && zip -q -r ../../EdenLauncher_windows-verification.zip .)
          assets+=(EdenLauncher_windows-verification.zip)
          while IFS= read -r -d '' plugin; do assets+=("$plugin"); done < <(find release-assets/EdenSkinBridge -type f \( -name 'EdenSkinBridge-Paper-*.jar' -o -name 'EdenSkinBridge-Velocity-*.jar' -o -name 'EdenSkinBridge-source.zip' \) -print0)
          cp docs/SKIN-STUDIO-2.10.md EdenLauncher-2.10-features.md
          assets+=(EdenLauncher-2.10-features.md)
          for asset in "${assets[@]}"; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")")
          done > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
